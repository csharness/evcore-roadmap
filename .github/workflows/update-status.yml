# Refreshes status.json from the CS Harness project board every hour (decision 0012).
# Needs the repository secret ROADMAP_TOKEN: a token that can read the project (a classic token
# with the read:project scope, owned by csharness). Without it the job does nothing.
name: Update roadmap status
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node update-status.mjs
        env:
          ROADMAP_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
      - name: Commit a changed status
        run: |
          if ! git diff --quiet -- status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Roadmap status update' -- status.json
            git push
          fi
